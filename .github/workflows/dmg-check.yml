# THROWAWAY (styled-dmg-installer, task 3.2): proves Finder lays out the disk image on macos-latest. Removed before merging.
name: DMG layout check

on:
  push:
    branches: [feat/styled-dmg-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build the app
        run: |
          bun install --frozen-lockfile
          bun run build:desktop

      - name: Check the layout
        run: |
          dmg="$(find desktop/artifacts -maxdepth 1 -name '*.dmg' | head -n 1)"
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          ls -la "$mount"
          codesign --verify --deep --strict --verbose=2 "$mount/Spec Control.app"
          test "$(readlink "$mount/Applications")" = /Applications
          test -f "$mount/.background/background.tiff"
          test -f "$mount/.DS_Store"
          test -f "$mount/.VolumeIcon.icns"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: styled-dmg
          path: desktop/artifacts/*.dmg
          if-no-files-found: error
          retention-days: 3
